<!doctype html>
<html lang="it">
  <head>
    <script type="text/javascript" src="https://embeds.iubenda.com/widgets/0369319f-6a6f-4d64-b1ef-d8467ecec3bd.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabio Meloni</title>
    <meta name="description" content="Portfolio personale di Fabio: progetti, percorso di studi ed esperienza." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          if (redirect !== location.pathname + location.search + location.hash) {
            window.history.replaceState(null, "", redirect);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
    <script type="text/javascript">
      (function (w, d) {
        var loader = function () {
          var s = d.createElement("script"),
            tag = d.getElementsByTagName("script")[0];
          s.src = "https://cdn.iubenda.com/iubenda.js";
          tag.parentNode.insertBefore(s, tag);
        };
        if (w.addEventListener) {
          w.addEventListener("load", loader, false);
        } else if (w.attachEvent) {
          w.attachEvent("onload", loader);
        } else {
          w.onload = loader;
        }
      })(window, document);
    </script>
  </body>
</html>
